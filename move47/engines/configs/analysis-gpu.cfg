# KataGo analysis-engine config for one A100 inside a Slurm job (<=2 CPUs per GPU).
# Search threads mostly wait on GPU batches, so they can exceed the CPU count; benchmark
# job 2336 (tf3-b11c768, 1600 visits) peaked at 32 threads: ~1600-1850 visits/s.
logToStderr = false
logAllRequests = false
logAllResponses = false
logSearchInfo = false
logDir = /tmp/move47-katago-logs
reportAnalysisWinratesAs = SIDETOMOVE
maxVisits = 2000
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 32
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 17
# benchmark job 2336: 2 NN server threads per GPU measured 17% faster on the A100
numNNServerThreadsPerModel = 2
nnRandomize = true
