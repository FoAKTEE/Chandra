# KataGo analysis-engine config used by goarena (opponents + referee + reviewer).
# Tuned for small CPU boxes; raise threads/batch size on bigger machines.
logToStderr = false
logAllRequests = false
logAllResponses = false
logSearchInfo = false
logDir = /tmp/goarena-katago-logs
reportAnalysisWinratesAs = SIDETOMOVE
maxVisits = 500
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 1
nnMaxBatchSize = 8
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
nnRandomize = true
